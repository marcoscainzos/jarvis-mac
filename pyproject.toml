[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-mac"
version = "0.4.0"
description = "Asistente personal local para macOS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Marcos" }]
dependencies = []

[project.optional-dependencies]
voice = [
    "faster-whisper>=1.1,<2",
    "numpy>=1.26,<3",
    "sounddevice>=0.5,<1",
]
mac-app = [
    "pynput>=1.7,<2",
    "rumps>=0.4,<1",
]
build = ["pyinstaller>=6,<7"]

[project.scripts]
jarvis = "jarvis.cli:main"
jarvis-app = "jarvis.menu_bar:main"
jarvis-install-app = "jarvis.macos_installer:main"
jarvis-login-enable = "jarvis.login_item:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
